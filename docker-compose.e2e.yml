services:
  postgres-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bugshot_e2e
      POSTGRES_USER: bugshot
      POSTGRES_PASSWORD: bugshot_e2e
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugshot -d bugshot_e2e"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - e2e

  minio-e2e:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bugshot-e2e
      MINIO_ROOT_PASSWORD: bugshot-e2e-password
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - e2e

  backend-e2e:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres-e2e:
        condition: service_healthy
      minio-e2e:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres-e2e;Port=5432;Database=bugshot_e2e;Username=bugshot;Password=bugshot_e2e
      Storage__AttachmentsPath: /var/lib/bugshot/attachments
      APP_DLL: BugShot.Api.dll
      JWT_SIGNING_KEY: ${E2E_JWT_SIGNING_KEY:?E2E_JWT_SIGNING_KEY must be set}
      ADMIN_EMAIL: admin@bug-shot.test
      ADMIN_PASSWORD: e2e-admin-not-a-real-password
      Cors__WidgetOrigins__0: http://127.0.0.1:5500
      Cors__DashboardOrigins__0: http://localhost:5175
    ports:
      - "127.0.0.1:8085:8080"
    networks:
      - e2e

  frontend-e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8085
        VITE_PROJECT_ID: 11111111-1111-1111-1111-111111111111
    depends_on:
      backend-e2e:
        condition: service_started
    ports:
      - "127.0.0.1:5175:80"
    networks:
      - e2e

networks:
  e2e:
    driver: bridge

