name: e2e

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yaml'
  pull_request:
    branches: [ "develop", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bugshot_test
          POSTGRES_USER: bugshot
          POSTGRES_PASSWORD: bugshot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bugshot -d bugshot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E2E_POSTGRES_PORT: '5432'
      E2E_POSTGRES_PASSWORD: bugshot_test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Restore .NET tools
        run: dotnet tool restore

      # API startuje przez playwright wiec build musi byc gotowy zanim ruszy webServer
      - name: Build API
        run: dotnet build backend/BugShot.slnx --configuration Debug

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Install e2e dependencies
        run: npm ci
        working-directory: ./e2e

      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: ./e2e

      - name: Run end to end tests
        run: npm test
        working-directory: ./e2e

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
