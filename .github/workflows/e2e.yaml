name: e2e

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'docker-compose.e2e.yml'
      - 'docker-compose.notifications.e2e.yml'
      - '.github/workflows/e2e.yaml'
  pull_request:
    branches: [ "develop", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bugshot_test
          POSTGRES_USER: bugshot
          POSTGRES_PASSWORD: bugshot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bugshot -d bugshot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E2E_POSTGRES_HOST: '127.0.0.1'
      E2E_POSTGRES_PORT: '5432'
      E2E_POSTGRES_USER: bugshot
      E2E_POSTGRES_PASSWORD: bugshot_test
      E2E_POSTGRES_DB: bugshot_e2e

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build API
        run: dotnet build backend/BugShot.slnx --configuration Debug

      - name: Prepare backend test database
        run: >
          dotnet ef database update
          --project backend/BugShot.Api/BugShot.Api.csproj
          --startup-project backend/BugShot.Api/BugShot.Api.csproj
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=bugshot_test;Username=bugshot;Password=bugshot_test

      - name: Backend tests with coverage
        run: >
          dotnet test backend/BugShot.slnx
          --configuration Debug
          --no-build
          --no-restore
          --settings e2e/backend.coverage.runsettings
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ${{ runner.temp }}/bugshot-backend-coverage
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
        env:
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=bugshot_test;Username=bugshot;Password=bugshot_test

      - name: Enforce backend coverage >= 70%
        run: node e2e/scripts/check-backend-coverage.mjs "${{ runner.temp }}/bugshot-backend-coverage" 70

      - name: Upload backend coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ${{ runner.temp }}/bugshot-backend-coverage/
          retention-days: 7

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Install e2e dependencies
        run: npm ci
        working-directory: ./e2e

      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: ./e2e

      - name: Run end to end tests
        run: npm test
        working-directory: ./e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
