name: release

# Trigger na kazdy push do main, BEZ path filtra — release-worthy commit moze
# dotyczyc backendu, frontendu, widgetu, docs, infra. deploy-prod.yaml i tak
# odpali sie dopiero pozniej, na push tagu utworzonego w jobie gh-release.
on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.compute.outputs.should_release }}
      next_version:   ${{ steps.compute.outputs.next_version }}
      last_tag:       ${{ steps.compute.outputs.last_tag }}
      bump:           ${{ steps.compute.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - id: compute
        run: bash scripts/release/compute-version.sh

  guard:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    permissions: { contents: read }
    runs-on: ubuntu-latest
    outputs:
      resume_from: ${{ steps.check.outputs.resume_from }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - id: check
        name: Rozpoznaj stan poprzedniego release (idempotencja / bezpieczny rerun)
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.next_version }}"
          TAG="v${VER}"

          git fetch --tags --quiet

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG nie istnieje — swiezy release, start od zera."
            echo "resume_from=start" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tag istnieje. Sprawdz, czy wskazuje na biezacy HEAD (spodziewane)
          # czy na inny commit (przypadek D — stop z bledem, to jest realny
          # konflikt, nie prosty rerun).
          TAG_SHA=$(git rev-list -n1 "$TAG")
          HEAD_SHA=$(git rev-parse HEAD)

          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Tag $TAG juz istnieje, ale wskazuje na inny commit ($TAG_SHA) niz biezacy HEAD ($HEAD_SHA). To NIE jest bezpieczny rerun — wymaga recznej decyzji (czy to duplikat wersji, czy pomylka w wyliczeniu). Zatrzymuje release."
              exit 1
          fi

          # Tag == HEAD. Sprawdz czy GitHub Release rowniez istnieje.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG i GitHub Release $TAG juz istnieja i wskazuja na HEAD — release juz kompletny (przypadek A)."
            echo "resume_from=complete" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG istnieje i wskazuje na HEAD, ale GitHub Release jeszcze nie powstal (przypadek B/C) — wznawiam publikacje artefaktow (kazdy krok jest idempotentny)."
            echo "resume_from=resume" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop jesli release juz w pelni kompletny
        if: steps.check.outputs.resume_from == 'complete'
        run: |
          echo "Nic do zrobienia — release v${{ needs.version.outputs.next_version }} juz istnieje w calosci."

  docker-retag:
    needs: [version, guard]
    if: needs.guard.outputs.resume_from != 'complete'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve najnowszy opublikowany SHA-image i retag (backend, frontend)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.next_version }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          OWNER_LC=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          HEAD_SHA7=$(git rev-parse --short=7 HEAD)

          for svc in backend frontend; do
            IMAGE="ghcr.io/${OWNER_LC}/bugshot-${svc}"
            SRC_TAG=""

            # FAST PATH: backend.yaml/frontend.yaml maja path-filtry (backend/**,
            # frontend/**), wiec jesli TEN konkretny commit dotknal danego serwisu,
            # obraz dla HEAD SHA istnieje juz w GHCR.
            if docker manifest inspect "${IMAGE}:${HEAD_SHA7}" >/dev/null 2>&1; then
              SRC_TAG="$HEAD_SHA7"
              echo "[$svc] fast path: HEAD SHA image istnieje (${HEAD_SHA7})"
            else
              # FALLBACK: ten commit nie dotknal $svc (np. release-worthy fix
              # dotyczyl tylko widgetu/docs) -> nie ma obrazu dla HEAD SHA.
              # Bierzemy najnowszy opublikowany krotki-SHA tag wprost z GHCR
              # Package API (nie z git-log-walk — API jest zrodlem prawdy o
              # tym, co faktycznie zostalo opublikowane).
              echo "[$svc] fallback: HEAD SHA image nie istnieje, szukam najnowszego w GHCR API"
              VJSON=$(gh api --paginate --slurp "users/${REPO_OWNER}/packages/container/bugshot-${svc}/versions?per_page=100" 2>/dev/null | jq -c 'add // []')
              if [ "$VJSON" = "[]" ] || [ -z "$VJSON" ]; then
                VJSON=$(gh api --paginate --slurp "orgs/${REPO_OWNER}/packages/container/bugshot-${svc}/versions?per_page=100" 2>/dev/null | jq -c 'add // []')
              fi
              [ -z "$VJSON" ] && VJSON="[]"
              SRC_TAG=$(printf '%s' "$VJSON" | jq -r '
                sort_by(.created_at) | reverse
                | map(.metadata.container.tags[]? // empty)
                | map(select(test("^[0-9a-f]{7}$")))
                | .[0] // empty')
            fi

            if [ -z "$SRC_TAG" ]; then
              echo "::error::[$svc] Brak jakiegokolwiek opublikowanego SHA-image w GHCR (ani HEAD, ani fallback z API). Release automation nie ma z czego zretagowac ${VERSION}. Sprawdz czy _image.yaml kiedykolwiek pomyslnie zbudowal ten serwis."
              exit 1
            fi

            echo "=== [$svc] retag ${SRC_TAG} -> :${VERSION}, :latest ==="
            docker buildx imagetools create \
              --tag "${IMAGE}:${VERSION}" \
              --tag "${IMAGE}:latest" \
              "${IMAGE}:${SRC_TAG}"
          done

  widget-publish:
    needs: [version, guard]
    if: needs.guard.outputs.resume_from != 'complete'
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Build dist
        run: node widget/scripts/build.mjs

      - name: Ustaw wersje w package.json (bez git taga, tylko w workspace runnera)
        working-directory: ./widget
        run: npm version "${{ needs.version.outputs.next_version }}" --no-git-tag-version --allow-same-version

      - name: Publish (idempotentnie — skip jesli ta wersja juz opublikowana)
        working-directory: ./widget
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.next_version }}"
          if npm view "@bug-shot/widget@${VER}" version >/dev/null 2>&1; then
            echo "@bug-shot/widget@${VER} juz opublikowane w npm — skip (bezpieczny rerun)."
          else
            npm publish --access public
          fi

  widget-cdn:
    needs: [version, guard, widget-publish]
    if: needs.guard.outputs.resume_from != 'complete'
    permissions: { contents: read }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dist
        run: node widget/scripts/build.mjs

      - uses: ./.github/actions/wg-connect
        with:
          wg_private_key:     ${{ secrets.WG_PRIVATE_KEY }}
          wg_endpoint:        ${{ secrets.WG_ENDPOINT }}
          wg_peer_public_key: ${{ secrets.WG_PEER_PUBLIC_KEY }}
          wg_runner_address:  ${{ secrets.WG_RUNNER_ADDRESS }}
          vps_address:        ${{ secrets.WG_VPS_ADDRESS }}
          deploy_ssh_key:     ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Sync widget dist na CDN (nginx /widgets/, istniejacy bind-mount)
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.next_version }}"

          # shellcheck disable=SC2029
          # VER is intentionally expanded by the runner before the remote mkdir command.
          ssh vps "mkdir -p ~/bugshot-prod/bug-shot-widgets/v${VER} ~/bugshot-prod/bug-shot-widgets/latest"

          # Katalog wersji: IMMUTABLE. Nigdy --delete, nigdy nie nadpisuj
          # istniejacej wersji (guard job juz zagwarantowal, ze ten commit
          # jeszcze nie mial pelnego release, wiec ten katalog jest albo
          # pusty, albo z przerwanego runu tej samej wersji — bezpieczne).
          rsync -az widget/dist/ "vps:~/bugshot-prod/bug-shot-widgets/v${VER}/"

          # latest/: jedyny katalog, ktory wolno nadpisywac / czyscic.
          rsync -az --delete widget/dist/ "vps:~/bugshot-prod/bug-shot-widgets/latest/"

      - name: Teardown WireGuard
        if: always()
        run: sudo wg-quick down wg0 || true

  gh-release:
    needs: [version, guard, docker-retag, widget-publish, widget-cdn]
    if: |
      always() &&
      needs.guard.result == 'success' &&
      needs.guard.outputs.resume_from != 'complete' &&
      needs.docker-retag.result == 'success' &&
      needs.widget-publish.result == 'success' &&
      needs.widget-cdn.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Render release notes (wlasny szablon + generated PR notes)
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.next_version }}"
          LAST="${{ needs.version.outputs.last_tag }}"
          [ -z "$LAST" ] && LAST="none"
          CDN_BASE="${{ vars.WIDGET_CDN_BASE_URL }}"
          if [ -z "$CDN_BASE" ]; then
            echo "::error::Repository variable WIDGET_CDN_BASE_URL nie jest ustawiona. Patrz RELEASE-AUTOMATION-SETUP.md."
            exit 1
          fi
          bash scripts/release/render-notes.sh "$VER" "$LAST" "$CDN_BASE" > /tmp/notes.md

      - name: Utworz tag + GitHub Release (finalny krok publikacji, idempotentny)
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.next_version }}"
          TAG="v${VER}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG juz istnieje (rownolegly rerun?) — skip create, exit 0."
            exit 0
          fi

          # Jesli tag juz istnieje (przypadek B z guard joba), gh release
          # create uzyje istniejacego taga zamiast tworzyc nowy na HEAD —
          # guard job juz potwierdzil, ze tag == HEAD, wiec to bezpieczne.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --target "$(git rev-parse HEAD)"
