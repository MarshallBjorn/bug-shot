name: _deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "staging | prod"
      image_tag:
        required: true
        type: string
        description: "Docker image tag to deploy (commit SHA short or semver)"
      rolling:
        required: false
        type: boolean
        default: false
        description: "Use rolling update (prod only)"
      triggered_by:
        required: false
        type: string
        default: ""
        description: "Who/what triggered this deploy"
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_HOST:
        required: true
      DISCORD_WEBHOOK_URL:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy metadata
        id: meta
        run: |
          {
            echo "timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "short_sha=${GITHUB_SHA::7}"
            echo "deploy_tag=${{ inputs.image_tag }}"
            echo "actor=${{ github.actor }}"
            echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config << 'SSHCONF'
          Host deploy-target
            HostName ${{ secrets.DEPLOY_HOST }}
            User deployer
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
            ServerAliveInterval 10
          SSHCONF

      - name: Pull images on target
        run: |
          ssh deploy-target << 'REMOTE'
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ inputs.image_tag }}"
          SERVICES="backend frontend"

          echo "--- Pulling images ---"
          for svc in $SERVICES; do
            IMAGE="ghcr.io/${OWNER}/bugshot-${svc}:${TAG}"
            echo "Pulling $IMAGE"
            docker pull "$IMAGE"
          done
          echo "--- Pull complete ---"
          REMOTE

      - name: Deploy (standard)
        if: ${{ !inputs.rolling }}
        run: |
          ssh deploy-target << 'REMOTE'
          set -euo pipefail
          cd ~/bugshot

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ inputs.image_tag }}"

          export BACKEND_IMAGE="ghcr.io/${OWNER}/bugshot-backend:${TAG}"
          export FRONTEND_IMAGE="ghcr.io/${OWNER}/bugshot-frontend:${TAG}"

          echo "$TAG" > .deploy-tag
          echo "${{ steps.meta.outputs.timestamp }}" > .deploy-timestamp

          docker compose --env-file .env.prod \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            up -d --no-build --remove-orphans

          echo "--- Waiting for services to be healthy ---"
          timeout 120 bash -c '
            until docker compose --env-file .env.prod \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              ps --format json | \
              python3 -c "
          import sys, json
          lines = sys.stdin.read().strip().split(chr(10))
          svcs = [json.loads(l) for l in lines if l.strip()]
          healthy = all(s.get(\"Health\",\"healthy\") == \"healthy\" for s in svcs if s.get(\"Health\"))
          sys.exit(0 if healthy else 1)
          "; do
              echo "Waiting for healthy..."
              sleep 5
            done
          '
          echo "--- All services healthy ---"
          REMOTE

      - name: Deploy (rolling - prod)
        if: ${{ inputs.rolling }}
        run: |
          ssh deploy-target << 'REMOTE'
          set -euo pipefail
          cd ~/bugshot

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ inputs.image_tag }}"

          export BACKEND_IMAGE="ghcr.io/${OWNER}/bugshot-backend:${TAG}"
          export FRONTEND_IMAGE="ghcr.io/${OWNER}/bugshot-frontend:${TAG}"

          PREV_TAG=""
          [ -f .deploy-tag ] && PREV_TAG=$(cat .deploy-tag)
          echo "$TAG" > .deploy-tag
          echo "$PREV_TAG" > .deploy-tag-prev
          echo "${{ steps.meta.outputs.timestamp }}" > .deploy-timestamp

          COMPOSE="docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml"

          for SERVICE in backend frontend; do
            echo "=== Rolling update: $SERVICE ==="

            # Scale up new instance alongside old
            $COMPOSE up -d --no-build --no-deps "$SERVICE"

            echo "Waiting for $SERVICE to be healthy..."
            timeout 120 bash -c "
              until docker inspect --format='{{.State.Health.Status}}' \
                \$($COMPOSE ps -q $SERVICE 2>/dev/null | head -1) 2>/dev/null | grep -q healthy; do
                sleep 3
              done
            "
            echo "$SERVICE healthy"
          done

          # Clean up orphaned containers
          $COMPOSE up -d --no-build --remove-orphans
          echo "=== Rolling update complete ==="
          REMOTE

      - name: Smoke test
        id: smoke
        run: |
          ssh deploy-target << 'REMOTE'
          set -euo pipefail
          cd ~/bugshot

          ENV="${{ inputs.environment }}"

          if [ "$ENV" = "staging" ]; then
            API_URL="${STAGING_API_URL:-http://localhost:8080}"
            APP_URL="${STAGING_APP_URL:-http://localhost:3000}"
          else
            API_URL="${PROD_API_URL:-http://localhost:8080}"
            APP_URL="${PROD_APP_URL:-http://localhost:3000}"
          fi

          echo "--- Smoke: healthz endpoints ---"
          for url in "$API_URL/healthz" "$APP_URL/healthz"; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url")
            if [ "$status" != "200" ]; then
              echo "FAIL: $url returned $status"
              exit 1
            fi
            echo "OK: $url → $status"
          done

          echo "--- Smoke: API response check ---"
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$API_URL/api/v1/health" 2>/dev/null || echo "000")
          if [ "$status" -ge 500 ] 2>/dev/null; then
            echo "FAIL: API /api/v1/health returned $status"
            exit 1
          fi
          echo "OK: API check passed (status: $status)"

          echo "--- Smoke tests passed ---"
          REMOTE

      - name: Playwright smoke test
        id: playwright-smoke
        continue-on-error: true
        run: |
          ssh deploy-target << 'REMOTE'
          set -euo pipefail
          cd ~/bugshot/e2e

          if [ -f package.json ] && grep -q playwright package.json; then
            ENV="${{ inputs.environment }}"
            if [ "$ENV" = "staging" ]; then
              export BASE_URL="${STAGING_APP_URL:-http://localhost:3000}"
            else
              export BASE_URL="${PROD_APP_URL:-http://localhost:3000}"
            fi

            npx playwright test smoke.spec.ts --reporter=list 2>&1 || {
              echo "Playwright smoke test failed"
              exit 1
            }
            echo "Playwright smoke passed"
          else
            echo "No Playwright smoke tests found, skipping"
          fi
          REMOTE

      - name: Auto-rollback on smoke failure
        if: failure() && steps.smoke.outcome == 'failure' && inputs.environment == 'prod'
        run: |
          ssh deploy-target << 'REMOTE'
          set -euo pipefail
          cd ~/bugshot

          PREV_TAG=""
          [ -f .deploy-tag-prev ] && PREV_TAG=$(cat .deploy-tag-prev)

          if [ -z "$PREV_TAG" ]; then
            echo "ERROR: No previous tag to rollback to"
            exit 1
          fi

          echo "=== AUTO-ROLLBACK to $PREV_TAG ==="
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          export BACKEND_IMAGE="ghcr.io/${OWNER}/bugshot-backend:${PREV_TAG}"
          export FRONTEND_IMAGE="ghcr.io/${OWNER}/bugshot-frontend:${PREV_TAG}"

          echo "$PREV_TAG" > .deploy-tag

          docker compose --env-file .env.prod \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            up -d --no-build --remove-orphans

          timeout 120 bash -c '
            until docker compose --env-file .env.prod \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              ps --format json | \
              python3 -c "
          import sys, json
          lines = sys.stdin.read().strip().split(chr(10))
          svcs = [json.loads(l) for l in lines if l.strip()]
          healthy = all(s.get(\"Health\",\"healthy\") == \"healthy\" for s in svcs if s.get(\"Health\"))
          sys.exit(0 if healthy else 1)
          "; do
              sleep 5
            done
          '
          echo "=== Rollback to $PREV_TAG complete ==="
          REMOTE

      - name: Discord notification
        if: always()
        run: |
          ENV="${{ inputs.environment }}"
          TAG="${{ inputs.image_tag }}"
          STATUS="${{ job.status }}"
          ACTOR="${{ steps.meta.outputs.actor }}"
          RUN_URL="${{ steps.meta.outputs.run_url }}"
          TIMESTAMP="${{ steps.meta.outputs.timestamp }}"
          TRIGGERED="${{ inputs.triggered_by }}"

          if [ "$STATUS" = "success" ]; then
            COLOR=3066993
            EMOJI="✅"
            TITLE="Deploy succeeded"
          elif [ "$STATUS" = "failure" ]; then
            COLOR=15158332
            EMOJI="❌"
            TITLE="Deploy FAILED"
          else
            COLOR=15105570
            EMOJI="⚠️"
            TITLE="Deploy cancelled"
          fi

          PAYLOAD=$(cat << ENDJSON
          {
            "embeds": [{
              "title": "$EMOJI $TITLE — $ENV",
              "color": $COLOR,
              "fields": [
                {"name": "Environment", "value": "$ENV", "inline": true},
                {"name": "Tag", "value": "\`$TAG\`", "inline": true},
                {"name": "Actor", "value": "$ACTOR", "inline": true},
                {"name": "Trigger", "value": "${TRIGGERED:-push}", "inline": true},
                {"name": "Timestamp", "value": "$TIMESTAMP", "inline": false},
                {"name": "Logs", "value": "[${{ github.run_id }}]($RUN_URL)", "inline": false}
              ]
            }]
          }
          ENDJSON
          )

          curl -sS -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || echo "Discord notification failed (non-fatal)"
