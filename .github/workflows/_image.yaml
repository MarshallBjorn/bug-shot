name: _image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag:   ${{ steps.vars.outputs.tag }}
      owner: ${{ steps.vars.outputs.owner }}
      image: ${{ steps.vars.outputs.image }}
    env:
      SERVICE: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare vars
        id: vars
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          TAG=${GITHUB_SHA::7}
          {
            echo "owner=$OWNER"
            echo "tag=$TAG"
            echo "image=ghcr.io/$OWNER/bugshot-$SERVICE:$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Hadolint
        run: make image-lint SERVICE="$SERVICE"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (populate GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.service }}
          tags: ${{ steps.vars.outputs.image }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to:   type=gha,mode=max,scope=${{ inputs.service }}


  scan-trivy:
    needs: build
    runs-on: ubuntu-latest
    env:
      SERVICE:     ${{ inputs.service }}
      IMAGE_OWNER: ${{ needs.build.outputs.owner }}
      IMAGE_TAG:   ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Load image from cache
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.service }}
          tags: ${{ needs.build.outputs.image }}
          load: true
          cache-from: type=gha,scope=${{ inputs.service }}

      - name: Restore trivy DB cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bugshot-ci/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Trivy scan
        run: make image-scan-trivy SERVICE="$SERVICE" IMAGE_TAG="$IMAGE_TAG"

  scan-dockle:
    needs: build
    runs-on: ubuntu-latest
    env:
      SERVICE:     ${{ inputs.service }}
      IMAGE_OWNER: ${{ needs.build.outputs.owner }}
      IMAGE_TAG:   ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Load image from cache
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.service }}
          tags: ${{ needs.build.outputs.image }}
          load: true
          cache-from: type=gha,scope=${{ inputs.service }}

      - name: Dockle Scan
        run: make image-scan-dockle SERVICE="$SERVICE" IMAGE_TAG="$IMAGE_TAG"

  push:
    needs: [build, scan-trivy, scan-dockle]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SERVICE:     ${{ inputs.service }}
      IMAGE_OWNER: ${{ needs.build.outputs.owner }}
      IMAGE_TAG:   ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (from cache)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.service }}
          tags: ${{ needs.build.outputs.image }}
          push: true
          cache-from: type=gha,scope=${{ inputs.service }}
