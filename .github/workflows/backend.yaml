name: backend

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yaml'
      - '.github/workflows/_image.yaml'
      - 'Makefile'
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore BugShot.slnx

    - name: Build
      run: dotnet build BugShot.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test BugShot.slnx --configuration Release --no-build --verbosity normal

  image:
      needs: build-test
      uses: ./.github/workflows/_image.yaml
      with:
        service: backend
      permissions:
        contents: read
        packages: write
