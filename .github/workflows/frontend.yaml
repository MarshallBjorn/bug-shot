name: NPM CI

on:
  push:
    paths:
      - 'frontend/**'
      - 'widget/**'
      - '.github/workflows/npm.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'widget/**'
      - '.github/workflows/npm.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        # cache: 'npm'
        # cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build
