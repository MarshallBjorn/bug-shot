name: deploy-staging

on:
  workflow_run:
    workflows: [backend, frontend]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "tag=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${SHA::7}"

      - uses: ./.github/actions/wg_connect
        with:
          wg_private_key:     ${{ secrets.WG_PRIVATE_KEY }}
          wg_endpoint:        ${{ secrets.WG_ENDPOINT }}
          wg_peer_public_key: ${{ secrets.WG_PEER_PUBLIC_KEY }}
          wg_runner_address:  ${{ secrets.WG_RUNNER_ADDRESS }}
          vps_address:        ${{ secrets.WG_VPS_ADDRESS }}
          deploy_ssh_key:     ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Verify images exist
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ steps.tag.outputs.tag }}"

          for svc in backend frontend; do
            IMAGE="ghcr.io/${OWNER}/bugshot-${svc}:${TAG}"
            echo "Checking $IMAGE..."
            docker manifest inspect "$IMAGE" > /dev/null 2>&1 || \
              { echo "Not found: $IMAGE"; exit 1; }
            echo "✓ $IMAGE"
          done

      - name: Deploy
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ steps.tag.outputs.tag }}"

          ssh vps DEPLOY_OWNER="$OWNER" DEPLOY_TAG="$TAG" bash << 'REMOTE'
          set -euo pipefail
          cd ~/bugshot-staging

          export BACKEND_IMAGE="ghcr.io/${DEPLOY_OWNER}/bugshot-backend:${DEPLOY_TAG}"
          export FRONTEND_IMAGE="ghcr.io/${DEPLOY_OWNER}/bugshot-frontend:${DEPLOY_TAG}"

          docker pull "$BACKEND_IMAGE"
          docker pull "$FRONTEND_IMAGE"

          echo "$DEPLOY_TAG" > .deploy-tag

          docker compose --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            up -d --no-build --remove-orphans
          REMOTE

      - name: Wait healthy
        run: |
          ssh vps bash << 'REMOTE'
          set -euo pipefail
          cd ~/bugshot-staging
          COMPOSE="docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml"

          for i in $(seq 1 24); do
            UNHEALTHY=$($COMPOSE ps --format '{{.Health}}' | grep -cv healthy || true)
            [ "$UNHEALTHY" -eq 0 ] && { echo "All healthy"; exit 0; }
            echo "Waiting... ($UNHEALTHY unhealthy)"
            sleep 5
          done
          echo "Timeout waiting for healthy"
          exit 1
          REMOTE

      - name: Smoke test
        run: |
          ssh vps bash << 'REMOTE'
          set -euo pipefail

          for url in http://localhost:8080/healthz http://localhost:3000/healthz; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url")
            [ "$status" = "200" ] || { echo "FAIL: $url → $status"; exit 1; }
            echo "OK: $url → $status"
          done
          REMOTE

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          TAG="${{ steps.tag.outputs.tag }}"
          [ "$STATUS" = "success" ] && COLOR=3066993 || COLOR=15158332

          curl -sS -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"Deploy staging — $STATUS\",
              \"color\": $COLOR,
              \"fields\": [
                {\"name\": \"Tag\", \"value\": \"\`$TAG\`\", \"inline\": true},
                {\"name\": \"By\", \"value\": \"${{ github.actor }}\", \"inline\": true},
                {\"name\": \"Logs\", \"value\": \"[Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\", \"inline\": true}
              ]
            }]
          }" "$DISCORD_WEBHOOK_URL" || true

      - name: Teardown WireGuard
        if: always()
        run: sudo wg-quick down wg0 || true
