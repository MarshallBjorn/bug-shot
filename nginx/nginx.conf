worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    log_format bugshot '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time';

    access_log /var/log/nginx/access.log bugshot;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    client_max_body_size 1m;
    client_body_timeout  10s;
    client_header_timeout 10s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/plain text/css;

    server {
        listen 80;
        server_name _;

        root /srv;

        autoindex off;

        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-Frame-Options        "DENY"        always;
        add_header Referrer-Policy        "no-referrer" always;

        error_page 400 401 403 404 405 413 414 494 500 501 502 503 504 /_error;
        location = /_error {
            internal;
            types { }
            default_type text/plain;
            charset utf-8;
            return 404 "Not Found\n";
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # =========================================================
        # /attachments/ — ticket attachments files (screens, PDFs, logs)
        # We do NOT give CORS: * — these are user data.
        # Force downloading (attachment) and block sniffing of type.
        # API writes to this catalogue, nginx only serves them.
        # =========================================================
        location /attachments/ {
            add_header Content-Disposition    "attachment"        always;
            add_header X-Content-Type-Options "nosniff"           always;
            add_header Cache-Control          "private, no-store" always;

            location ~* /\. { deny all; }

            try_files $uri =404;
        }

        # =========================================================
        # /widgets/ — public JS bundle inserted to foreign websides.
        # ONLY here do we allow wide CORS: * (widget must load on
        # every users domain).
        # =========================================================
        location ~ ^/widgets/v[0-9] {
            add_header X-Content-Type-Options       "nosniff"                             always;
            add_header Access-Control-Allow-Origin  "*"                                   always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS"                        always;
            add_header Cache-Control                "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ~ ^/widgets/latest {
            add_header X-Content-Type-Options       "nosniff"             always;
            add_header Access-Control-Allow-Origin  "*"                   always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS"        always;
            add_header Cache-Control                "public, max-age=300" always;
            try_files $uri =404;
        }

        location /widgets/ {
            add_header X-Content-Type-Options       "nosniff"      always;
            add_header Access-Control-Allow-Origin  "*"            always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Cache-Control                "no-store"     always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "*"            always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Max-Age       86400          always;
                return 204;
            }

            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
