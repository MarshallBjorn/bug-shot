server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config — generowany przy starcie kontenera do /tmp (tmpfs, bo rootfs
    # jest read_only). Exact-match `=` ma wyzszy priorytet niz regex ponizej, wiec
    # config.js NIE trafia pod `immutable`. Nigdy nie cache'owac — zmienia sie per deploy.
    location = /config.js {
        alias /tmp/config.js;
        add_header Cache-Control "no-store" always;
    }

    # Healthcheck (docker + smoke). Zwraca 200 bez logowania.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache statyków, poza index.html i config.js (te maja wlasne, wyzej)
    location ~* \.(js|css|png|jpg|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
