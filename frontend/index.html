<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <title>Bug-shot</title>
    <script>
      // motyw ustawia sie przed pierwszym malowaniem bo inaczej ciemny panel mignalby na bialo
      // brak zapisu albo zapisany 'system' znaczy ze decyduje ustawienie systemowe
      (function () {
        try {
          var saved = localStorage.getItem('bugshot-theme')
          var mode = saved === 'dark' || saved === 'light' ? saved : 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <!-- Runtime config: external same-origin file (CSP script-src 'self' OK).
         Dev: served from public/. Prod: overwritten per-deploy by the container
         entrypoint from .env.prod. Loads before the deferred module bundle. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
